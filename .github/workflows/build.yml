name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          
      - name: Write Project Files
        run: |
          mkdir -p app/src/main/java/com/aimbot/app
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          
          cat > settings.gradle <<'EOF'
          include ':app'
          rootProject.name = "aimbot"
          EOF
          
          cat > build.gradle <<'EOF'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.4' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.aimbot.app'
              compileSdk 34
              defaultConfig { applicationId "com.aimbot.app"; minSdk 26; targetSdk 34 }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <application android:label="EINBOT">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="specialUse"/>
                  <service android:name=".CaptureService" android:exported="false" android:foregroundServiceType="mediaProjection"/>
                  <service android:name=".AimAccessibilityService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeAllMask" android:canPerformGestures="true" android:description="@string/app_name"/>
          EOF
          
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">EINBOT</string></resources>
          EOF
          
          cat > app/src/main/java/com/aimbot/app/MainActivity.java <<'EOF'
          package com.aimbot.app;
          import android.app.Activity; import android.content.*; import android.media.projection.*; import android.os.*; import android.net.Uri; import android.provider.Settings; import android.widget.*;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout l = new LinearLayout(this); Button btn = new Button(this);
                  btn.setText("INJETAR"); l.addView(btn); setContentView(l);
                  MediaProjectionManager m = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  btn.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) startActivity(new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName())));
                      else startActivityForResult(m.createScreenCaptureIntent(), 1);
                  });
              }
              protected void onActivityResult(int r, int c, Intent d) {
                  super.onActivityResult(r, c, d);
                  if (c == RESULT_OK) {
                      Intent i = new Intent(this, CaptureService.class).putExtra("d", d).putExtra("c", c);
                      startForegroundService(i);
                      startForegroundService(new Intent(this, OverlayService.class));
                      try { Intent game = getPackageManager().getLaunchIntentForPackage("com.dts.freefireth"); if (game != null) startActivity(game); } catch (Exception e) {}
                      finish();
                  }
              }
          }
          EOF
          
          cat > app/src/main/java/com/aimbot/app/OverlayService.java <<'EOF'
          package com.aimbot.app;
          import android.app.*; import android.content.*; import android.graphics.PixelFormat; import android.os.*; import android.view.*; import android.widget.*;
          public class OverlayService extends Service {
              public static boolean AIM_ON = false;
              public void onCreate() {
                  WindowManager wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  LinearLayout l = new LinearLayout(this); l.setOrientation(1); l.setBackgroundColor(0xEE1A1A1A); l.setPadding(40,40,40,40);
                  Switch sw = new Switch(this); sw.setText("AIMBOT (HEAD)"); sw.setTextColor(0xFFFFFFFF); sw.setOnCheckedChangeListener((b, v) -> AIM_ON = v);
                  Button bc = new Button(this); bc.setText("FECHAR"); bc.setOnClickListener(x -> stopSelf());
                  l.addView(sw); l.addView(bc);
                  wm.addView(l, new WindowManager.LayoutParams(-2, -2, 2038, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT));
              }
              public IBinder onBind(Intent i) { return null; }
          }
          EOF
          
          cat > app/src/main/java/com/aimbot/app/CaptureService.java <<'EOF'
          package com.aimbot.app;
          import android.app.*; import android.content.*; import android.graphics.PixelFormat; import android.hardware.display.*; import android.media.Image; import android.media.ImageReader; import android.media.projection.*; import android.os.*; import android.util.DisplayMetrics; import android.view.WindowManager; import java.nio.ByteBuffer;
          public class CaptureService extends Service {
              public int onStartCommand(Intent i, int f, int s) {
                  DisplayMetrics m = new DisplayMetrics(); ((WindowManager) getSystemService(WINDOW_SERVICE)).getDefaultDisplay().getRealMetrics(m);
                  MediaProjection p = ((MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE)).getMediaProjection(i.getIntExtra("c", 0), i.getParcelableExtra("d"));
                  ImageReader r = ImageReader.newInstance(m.widthPixels, m.heightPixels, PixelFormat.RGBA_8888, 2);
                  p.createVirtualDisplay("v", m.widthPixels, m.heightPixels, m.densityDpi, 0, r.getSurface(), null, null);
                  r.setOnImageAvailableListener(reader -> {
                      Image img = reader.acquireLatestImage(); if (img == null) return;
                      if (OverlayService.AIM_ON) {
                          ByteBuffer b = img.getPlanes()[0].getBuffer(); int st = img.getPlanes()[0].getRowStride();
                          for(int y=1100; y<1300; y+=8) { for(int x=500; x<600; x+=8) {
                              int off = y*st + x*4; if (off < b.capacity() && (b.get(off)&0xFF)>150 && (b.get(off+1)&0xFF)<100) {
                                  Intent cmd = new Intent("AIM").putExtra("x", x - 540).putExtra("y", y - 1200);
                                  sendBroadcast(cmd); img.close(); return;
                              }
                          }}
                      }
                      img.close();
                  }, null);
                  return START_STICKY;
              }
              public IBinder onBind(Intent i) { return null; }
          }
          EOF
          
          cat > app/src/main/java/com/aimbot/app/AimAccessibilityService.java <<'EOF'
          package com.aimbot.app;
          import android.accessibilityservice.*; import android.content.*; import android.graphics.Path; import android.view.accessibility.AccessibilityEvent;
          public class AimAccessibilityService extends AccessibilityService {
              public void onServiceConnected() {
                  registerReceiver(new BroadcastReceiver() {
                      public void onReceive(Context c, Intent i) {
                          Path p = new Path(); p.moveTo(500, 1000); p.lineTo(500 + i.getIntExtra("x", 0), 1000 + i.getIntExtra("y", 0));
                          dispatchGesture(new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p, 0, 10)).build(), null, null);
                      }
                  }, new IntentFilter("AIM"), Context.RECEIVER_EXPORTED);
              }
              public void onAccessibilityEvent(AccessibilityEvent e) {}
              public void onInterrupt() {}
          }
          EOF

      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EINBOT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
