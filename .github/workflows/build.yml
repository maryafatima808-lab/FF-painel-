name: build-apk
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          
      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/aimbot/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          rootProject.name = "EINBOT"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.aimbot.app'
              compileSdk 33

              defaultConfig {
                  applicationId "com.aimbot.app"
                  minSdk 23
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:colorAccent">#B45CFF</item>
              </style>
          </resources>
          EOF
          
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/app_name" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <queries>
                  <package android:name="com.dts.freefireth"/>
                  <package android:name="com.dts.freefiremax"/>
              </queries>
              <application android:theme="@style/AppTheme" android:label="EINBOT VIP">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".OverlayService" android:exported="false" />
                  <service android:name=".CaptureService" android:exported="false" android:foregroundServiceType="mediaProjection"/>
                  <service android:name=".AimAccessibilityService" android:exported="true" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/aimbot/app/MainActivity.java <<'EOF'
          package com.aimbot.app;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.*;
          import android.media.projection.MediaProjectionManager;
          public class MainActivity extends Activity {
              private static final int REQ_OVERLAY = 101;
              private static final int REQ_CAPTURE = 102;
              private String selectedPackage = "com.dts.freefireth";
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(1);
                  root.setPadding(30,40,30,30);
                  root.setBackgroundColor(Color.rgb(16,9,27));
                  TextView title = new TextView(this);
                  title.setText("EINBOT VIP");
                  title.setTextColor(0xFFCA8AFF);
                  title.setTextSize(30);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);
                  Button normal = makeButton("FREE FIRE NORMAL");
                  Button max = makeButton("FREE FIRE MAX");
                  Button inject = makeButton("INJETAR");
                  root.addView(normal); root.addView(max); root.addView(inject);
                  normal.setOnClickListener(v -> selectedPackage = "com.dts.freefireth");
                  max.setOnClickListener(v -> selectedPackage = "com.dts.freefiremax");
                  inject.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          Intent permission = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + getPackageName()));
                          startActivityForResult(permission, REQ_OVERLAY);
                      } else {
                          pedirCaptura();
                      }
                  });
                  setContentView(root);
              }
              private void pedirCaptura() {
                  MediaProjectionManager mp = (MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE);
                  startActivityForResult(mp.createScreenCaptureIntent(), REQ_CAPTURE);
              }
              private Button makeButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(0xFF632A91);
                  return b;
              }
              private void startPanel(Intent data, int resultCode) {
                  Intent service = new Intent(this, OverlayService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(service);
                  else startService(service);
                  Intent cap = new Intent(this, CaptureService.class);
                  cap.putExtra("resultCode", resultCode);
                  cap.putExtra("data", data);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(cap);
                  else startService(cap);
                  Intent game = getPackageManager().getLaunchIntentForPackage(selectedPackage);
                  if (game != null) startActivity(game);
              }
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_OVERLAY) {
                      if (Settings.canDrawOverlays(this)) pedirCaptura();
                  } else if (requestCode == REQ_CAPTURE && resultCode == RESULT_OK) {
                      startPanel(data, resultCode);
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/aimbot/app/OverlayService.java <<'EOF'
          package com.aimbot.app;
          import android.app.*;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.*;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;
          public class OverlayService extends Service {
              public static volatile boolean AIM_ON = false;
              private WindowManager wm;
              private View panel;
              @Override
              public void onCreate() {
                  super.onCreate();
                  wm = (WindowManager)getSystemService(WINDOW_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel("einbot", "EINBOT VIP", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                  }
                  Notification.Builder notification = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(this,"einbot") : new Notification.Builder(this);
                  startForeground(10,notification.setContentTitle("EINBOT VIP").setSmallIcon(android.R.drawable.ic_menu_view).build());
              }
              @Override
              public int onStartCommand(Intent intent,int flags,int id) {
                  if (Settings.canDrawOverlays(this)) showPanel();
                  return START_STICKY;
              }
              private void showPanel() {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(1);
                  box.setPadding(30,30,30,30);
                  box.setBackgroundColor(0xEE190D27);
                  Switch control = new Switch(this);
                  control.setText("CONTROLE ON/OFF");
                  control.setTextColor(Color.WHITE);
                  control.setOnCheckedChangeListener((v,checked) -> AIM_ON = checked);
                  box.addView(control);
                  Button close = new Button(this);
                  close.setText("FECHAR");
                  close.setOnClickListener(v -> stopSelf());
                  box.addView(close);
                  panel = box;
                  WindowManager.LayoutParams panelParams = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      Build.VERSION.SDK_INT >= 26 ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY : WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );
                  panelParams.gravity = Gravity.TOP | Gravity.START;
                  panelParams.x = 20; panelParams.y = 130;
                  wm.addView(panel,panelParams);
              }
              @Override public void onDestroy() { if (panel != null) wm.removeView(panel); super.onDestroy(); }
              @Override public android.os.IBinder onBind(Intent intent) { return null; }
          }
          EOF
          
          cat > app/src/main/java/com/aimbot/app/CaptureService.java <<'EOF'
          package com.aimbot.app;
          import android.app.*; import android.content.*; import android.graphics.PixelFormat; import android.hardware.display.*; import android.media.Image; import android.media.ImageReader; import android.media.projection.*; import android.os.*; import android.util.DisplayMetrics; import android.view.WindowManager; import java.nio.ByteBuffer;
          public class CaptureService extends Service {
              private MediaProjection proj; private VirtualDisplay vd; private ImageReader rd; private int W, H;
              @Override public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent == null) return 2; startForeground(2, new Notification.Builder(this, "f").setContentTitle("Cap").setSmallIcon(android.R.drawable.ic_menu_camera).build());
                  DisplayMetrics m = new DisplayMetrics(); ((WindowManager) getSystemService(WINDOW_SERVICE)).getDefaultDisplay().getRealMetrics(m); W = m.widthPixels; H = m.heightPixels;
                  proj = ((MediaProjectionManager) getSystemService(MEDIA_PROJECTION_SERVICE)).getMediaProjection(intent.getIntExtra("resultCode", 0), (Intent) intent.getParcelableExtra("data"));
                  rd = ImageReader.newInstance(W, H, PixelFormat.RGBA_8888, 2); vd = proj.createVirtualDisplay("c", W, H, m.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, rd.getSurface(), null, new Handler(Looper.getMainLooper()));
                  rd.setOnImageAvailableListener(r -> {
                      Image img = null; try { img = r.acquireLatestImage(); } catch (Exception e) {}
                      if (img == null) return;
                      if (OverlayService.AIM_ON) {
                          ByteBuffer buf = img.getPlanes()[0].getBuffer(); int cx = W/2, cy = H/2; int f = 200; int bx = -1, by = -1; int bd = f*f;
                          for (int y = cy-f; y < cy+f; y+=8) { if (y<0||y>=H) continue; for (int x = cx-f; x < cx+f; x+=8) { if (x<0||x>=W) continue; int off = y*img.getPlanes()[0].getRowStride() + x*img.getPlanes()[0].getPixelStride();
                              int red = buf.get(off)&0xFF, grn = buf.get(off+1)&0xFF, blu = buf.get(off+2)&0xFF;
                              if (red > 150 && red > grn+50 && red > blu+50) { int d = (x-cx)*(x-cx)+(y-cy)*(y-cy); if (d < bd) { bd = d; bx = x; by = y; } }
                          }}
                          if (bx != -1) { 
                              Intent i = new Intent("com.aimbot.AIM_CMD"); i.setPackage(getPackageName()); 
                              i.putExtra("dx", (bx-cx)/4); i.putExtra("dy", ((by-cy)-120)/4); 
                              sendBroadcast(i); 
                          }
                      }
                      img.close();
                  }, new Handler(Looper.getMainLooper()));
                  return 2;
              }
              @Override public IBinder onBind(Intent i) { return null; }
          }
          EOF
          
          cat > app/src/main/java/com/aimbot/app/AimAccessibilityService.java <<'EOF'
          package com.aimbot.app;
          import android.accessibilityservice.*; import android.content.*; import android.graphics.Path; import android.view.accessibility.AccessibilityEvent; import java.util.Random;
          public class AimAccessibilityService extends AccessibilityService {
              @Override public void onServiceConnected() {
                  BroadcastReceiver rx = new BroadcastReceiver() { @Override public void onReceive(Context c, Intent i) {
                      int dx = i.getIntExtra("dx", 0), dy = i.getIntExtra("dy", 0); if (dx==0&&dy==0) return;
                      Path p = new Path(); int sx = 500, sy = 1000; p.moveTo(sx, sy);
                      Random r = new Random();
                      p.quadTo(sx + (dx/2) + r.nextInt(20) - 10, sy + (dy/2) + r.nextInt(20) - 10, sx+dx, sy+dy);
                      dispatchGesture(new GestureDescription.Builder().addStroke(new GestureDescription.StrokeDescription(p, 0, 15 + r.nextInt(15))).build(), null, null);
                  }};
                  if (android.os.Build.VERSION.SDK_INT >= 33) registerReceiver(rx, new IntentFilter("com.aimbot.AIM_CMD"), Context.RECEIVER_NOT_EXPORTED); else registerReceiver(rx, new IntentFilter("com.aimbot.AIM_CMD"));
              }
              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EINBOT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
